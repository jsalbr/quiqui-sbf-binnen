- question: Mehrere Kleinfahrzeuge sollen gemeinsam vom Oberwasser in das Unterwasser geschleust werden.
    Worauf ist bei deren Einfahrt in die Schleuse und während des Schleusens besonders zu achten?
  type: single
  answers:
  - Das letzte Kleinfahrzeug muss so weit einfahren, dass es beim Leeren der Schleuse nicht auf den Drempel
    aufsetzen kann. Die Festmacherleinen sind so zu bedienen, dass Stöße gegen Schleusenwände, Schleusentore,
    andere Fahrzeuge vermieden werden und ein sicheres Fieren der Leinen möglich ist.
  - Das erste Kleinfahrzeug muss so weit einfahren, dass es beim Leeren der Schleuse nicht auf den Drempel
    aufsetzen kann. Die Festmacherleinen sind so zu bedienen, dass Stöße gegen Schleusenwände, Schleusentore,
    andere Fahrzeuge vermieden werden und ein sicheres Fieren der Leinen möglich ist.
  - Das erste Kleinfahrzeug muss so weit einfahren, dass es beim Füllen der Schleuse nicht auf den Drempel
    aufsetzen kann. Die Festmacherleinen sind so zu bedienen, dass Stöße gegen Schleusenwände, Schleusentore,
    andere Fahrzeuge vermieden werden und ein sicheres Fieren der Leinen möglich ist.
  - Das letzte Kleinfahrzeug muss so weit einfahren, dass es beim Füllen der Schleuse nicht auf den Drempel
    aufsetzen kann. Die Festmacherleinen sind so zu bedienen, dass Stöße gegen Schleusenwände, Schleusentore,
    andere Fahrzeuge vermieden werden und ein sicheres Fieren der Leinen möglich ist.
  correct: A
  explanation: |
    **§ 6.28 Nr. 8 BinSchStrO (Einfahrt in Schleusen)** ·
    [§ 6.28](https://www.gesetze-im-internet.de/binschstro_2012/__6_28.html)

    > Insbesondere muss das oder der letzte vom Oberwasser her einfahrende Fahrzeug oder
    > Schwimmkörper so weit vorfahren, dass es oder er beim Leeren der Schleusenkammer nicht auf den
    > Drempel aufsetzen kann.

    **§ 6.28 Nr. 9 Buchstabe b BinSchStrO (in den Schleusenkammern)** ·
    [§ 6.28](https://www.gesetze-im-internet.de/binschstro_2012/__6_28.html)

    > In den Schleusenkammern […] muss ein Fahrzeug während des Füllens und Leerens der
    > Schleusenkammer und bis zur Freigabe der Ausfahrt festgemacht sein und die Befestigungsmittel
    > müssen derart bedient werden, dass Stöße gegen die Schleusenwände, die Schleusentore oder die
    > Schutzvorrichtungen sowie gegen ein anderes Fahrzeug oder einen Schwimmkörper vermieden werden

