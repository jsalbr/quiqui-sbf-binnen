  - Empfohlene Durchfahrt mit Gegenverkehr und seitlicher Begrenzung der erlaubten Brückendurchfahrt.
  - Empfohlene Durchfahrt ohne Gegenverkehr und seitlicher Begrenzung der erlaubten Brückendurchfahrt.
  - Vorgeschriebene Durchfahrt mit Gegenverkehr und seitlicher Begrenzung der erlaubten Brückendurchfahrt.
  - Empfohlene Durchfahrt mit Gegenverkehr ohne seitliche Begrenzung der erlaubten Brückendurchfahrt.
  correct: A
  explanation: |
    **§ 6.24 Nr. 2 BinSchStrO (Brücken und Wehre)** ·
    [§ 6.24](https://www.gesetze-im-internet.de/binschstro_2012/__6_24.html)

    > durch das Tafelzeichen A.10 (Anlage 7), ist die Schifffahrt in dieser Öffnung außerhalb des
    > durch die beiden Tafeln dieses Zeichens begrenzten Raumes verboten;

    **§ 6.25 Nr. 2 Satz 2 BinSchStrO (feste Brücken)** ·
    [§ 6.25](https://www.gesetze-im-internet.de/binschstro_2012/__6_25.html)

    > Ist die Öffnung nach Satz 1 Buchstabe a gekennzeichnet, ist die Durchfahrt in beiden
    > Richtungen erlaubt;

- question: |-
    Was bedeutet dieses Tafelzeichen an einer Brückendurchfahrt?

    ![Bild zu Frage 244](https://www.elwis.de/DE/Schifffahrtsrecht/Binnenschifffahrtsrecht/Grafiken/Anlage-07/Verbotszeichen-A01-Tafeln.gif?__blob=normal&v=2)
  type: single
  answers:
  - Verbot der Durchfahrt und Sperrung der Schifffahrt.
  - Gesperrte Durchfahrt, jedoch für Kleinfahrzeuge mit Antriebsmaschine befahrbar.
  - Gesperrte Durchfahrt, jedoch für Kleinfahrzeuge ohne Antriebsmaschine befahrbar.
  - Schutzbedürftige Anlage.
  correct: A
  explanation: |
    **§ 6.25 Nr. 1 BinSchStrO (feste Brücken)** ·
    [§ 6.25](https://www.gesetze-im-internet.de/binschstro_2012/__6_25.html)

    > Ist eine bestimmte Öffnung fester Brücken durch ein allgemeines Zeichen A.1 (Anlage 7)
    > gekennzeichnet, ist das Durchfahren dieser Öffnung verboten.

- question: Warum ist es bei der Schleusendurchfahrt verboten, Autoreifen als Fender zu benutzen?
  type: single
  answers:
  - Autoreifen sind nicht schwimmfähig und können in den Schleusen zu erheblichen Störungen führen.
  - Autoreifen erzeugen eine zu hohe Reibung.
  - Autoreifen erzeugen schwarze Farbspuren am Boot und an der Schleusenmauer.
  - Autoreifen sind schwimmfähig und können in der Schleuse zu erheblichen Störungen führen.
  correct: A
  explanation: |
    **§ 6.28 Nr. 9 Buchstabe c BinSchStrO (in den Schleusenkammern)** ·
    [§ 6.28](https://www.gesetze-im-internet.de/binschstro_2012/__6_28.html)

    > In den Schleusenkammern […] sind Fender zu verwenden, die schwimmfähig sein müssen, wenn sie
    > nicht fest mit dem Fahrzeug verbunden sind

    Autoreifen werden im Gesetz nicht genannt. Sie sind nicht schwimmfähig und deshalb als nicht
    fest verbundene Fender unzulässig.
