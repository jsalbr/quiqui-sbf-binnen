  - Durchfahrt für Kleinfahrzeuge.
  correct: A
  explanation: |
    **§ 3.29 Nr. 1 BinSchStrO (Schutz gegen Sog und Wellenschlag)** ·
    [§ 3.29](https://www.gesetze-im-internet.de/binschstro_2012/__3_29.html)

    > kann zusätzlich zu der anderen nach dieser Verordnung vorgeschriebenen Bezeichnung führen: a)
    > bei Nacht: ein rotes gewöhnliches und ein weißes gewöhnliches Licht […], das rote Licht 1,00 m
    > über dem weißen

    **§ 6.20 Nr. 3 Buchstabe b BinSchStrO (Vermeidung von Wellenschlag)** ·
    [§ 6.20](https://www.gesetze-im-internet.de/binschstro_2012/__6_20.html)

