- question: Wie ist ein enges Gewässer zu befahren, wenn man sich am Ufer festgemachten Fahrzeugen nähert?
  type: single
  answers:
  - Verringerung der Geschwindigkeit, um schädlichen Sog und Wellenschlag zu vermeiden.
  - Beibehaltung der Geschwindigkeit, um durch Gleitfahrt schädlichen Sog und Wellenschlag auszuschließen.
  - Verringerung der Geschwindigkeit und nötigenfalls vom Rechtsfahrgebot abweichen.
  - Auf Höhe der festgemachten Fahrzeuge aufstoppen und überprüfen, dass kein Dritter behindert oder geschädigt
    wird.
  correct: A
  explanation: |
    **§ 6.20 Nr. 1 Satz 2 Buchstaben b bis d BinSchStrO (Vermeidung von Wellenschlag)** ·
    [§ 6.20](https://www.gesetze-im-internet.de/binschstro_2012/__6_20.html)

    > Es muss seine Geschwindigkeit rechtzeitig vermindern, jedoch nicht unter das Maß, das zu
    > seiner sicheren Steuerung notwendig ist: […] b) in der Nähe eines Fahrzeugs, das am Ufer oder
    > an einer Landebrücke festgemacht ist oder das lädt oder löscht; c) in der Nähe eines
    > Fahrzeugs, das auf einer üblichen Liegestelle stillliegt; d) in der Nähe einer nicht frei
    > fahrenden Fähre;

- question: Wo kann man von bestehenden Höchstgeschwindigkeiten auf den Binnenschifffahrtsstraßen Kenntnis
    erhalten?
  type: single
  answers:
  - In der Binnenschifffahrtsstraßen-Ordnung, bei der Wasserstraßen- und Schifffahrtsverwaltung und der
    Wasserschutzpolizei.
  - In der Binnenschiffsuntersuchungsordnung, bei der Wasserstraßen- und Schifffahrtsverwaltung und der
    Wasserschutzpolizei.
  - In der Sportbootführerscheinverordnung, bei der Wasserstraßen- und Schifffahrtsverwaltung und der
    Wasserschutzpolizei.
  - In der Binnenschifferpatentverordnung, bei der Wasserstraßen- und Schifffahrtsverwaltung und der Wasserschutzpolizei.
  correct: A
  explanation: |
    **§ 10.04 Nr. 1 BinSchStrO (Fahrgeschwindigkeit (Beispiel Neckar))** ·
    [§ 10.04](https://www.gesetze-im-internet.de/binschstro_2012/__10_04.html)

    > Die zulässige Höchstgeschwindigkeit gegenüber dem Ufer beträgt oberhalb km 4,60 a) für ein
    > Fahrzeug oder einen Verband, ausgenommen Fahrgastschiffe oder Kleinfahrzeuge, 16 km/h, b) für
    > ein Fahrgastschiff oder ein Kleinfahrzeug 18 km/h.

    Höchstgeschwindigkeiten stehen für jede Wasserstraße im Zweiten Teil der BinSchStrO, meist im
    Paragraphen „Fahrgeschwindigkeit“ (x.04). Vor Ort zeigt sie das Gebotszeichen B.6 an. Die
    Auskunftsstellen WSV und Wasserschutzpolizei nennt das Gesetz nicht.

- question: |-
