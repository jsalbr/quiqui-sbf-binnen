- question: Wo ist die Geschwindigkeit zu vermindern, um Sog und Wellenschlag zu vermeiden?
  type: single
  answers:
  - Vor Hafeneinmündungen, an Lade-, Lösch- und Liegeplätzen, in der Nähe nicht frei fahrender Fähren,
    auf gekennzeichneten Strecken, in der Nähe schwimmender Geräte bei der Arbeit.
  - Vor Einmündungen, an Lade-, Lösch- und Liegeplätzen, in der Nähe nicht frei fahrender Fähren, auf
    gekennzeichneten Strecken, in der Nähe schwimmender Geräte bei der Arbeit.
  - Vor Hafeneinmündungen, an Lade-, Lösch- und Liegeplätzen, in der Nähe frei fahrender Fähren, auf gekennzeichneten
    Strecken, in der Nähe schwimmender Geräte bei der Arbeit.
  - Vor Hafeneinmündungen, an Lade-, Lösch- und Liegeplätzen, in der Nähe nicht frei fahrender Fähren,
    auf gekennzeichneten Strecken, in der Nähe schwimmender Schifffahrtszeichen.
  correct: A
  explanation: |
    **§ 6.20 Nr. 1 Satz 2 BinSchStrO (Vermeidung von Wellenschlag)** ·
    [§ 6.20](https://www.gesetze-im-internet.de/binschstro_2012/__6_20.html)

    > Es muss seine Geschwindigkeit rechtzeitig vermindern, jedoch nicht unter das Maß, das zu
    > seiner sicheren Steuerung notwendig ist: a) vor einer Hafeneinmündung; b) in der Nähe eines
    > Fahrzeugs, das am Ufer oder an einer Landebrücke festgemacht ist oder das lädt oder löscht; c)
    > in der Nähe eines Fahrzeugs, das auf einer üblichen Liegestelle stillliegt; d) in der Nähe
    > einer nicht frei fahrenden Fähre; e) auf einer Strecke, die durch das Zeichen A.9 (Anlage 7)
    > gekennzeichnet ist.
    >
    > Beim Vorbeifahren a) an einem Fahrzeug, das die Bezeichnung nach § 3.25 Nummer 1 Satz 2
    > Buchstabe a führt, […] muss ein anderes Fahrzeug seine Geschwindigkeit, wie in Nummer 1
    > vorgeschrieben, vermindern.

