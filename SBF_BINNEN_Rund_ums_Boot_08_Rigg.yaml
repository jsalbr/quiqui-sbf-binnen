- question: Ein Segelboot segelt bei starkem Wind nur unter Großsegel auf Amwindkurs. Plötzlich bricht
    das Vorstag. Womit kann das gebrochene Vorstag schnell provisorisch ersetzt werden?
  type: single
  answers:
  - Durch die Fock oder ein Fall.
  - Durch die Fockschot oder das Großfall.
