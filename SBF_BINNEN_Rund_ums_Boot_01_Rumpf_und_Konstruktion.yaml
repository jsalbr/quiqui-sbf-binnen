- question: Was wird unter einem "Kimmkieler" verstanden?
  type: single
  answers:
  - Eine Yacht mit zwei Seitenkielen.
  - Eine Yacht mit zwei Seitenschwertern.
  - Eine Yacht mit einem Kielschwert.
