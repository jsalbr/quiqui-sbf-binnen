- question: |-
    Wie lang ist die Dauer eines kurzen Tons?

    ![Bild zu Frage 4](https://www.elwis.de/DE/Schifffahrtsrecht/Binnenschifffahrtsrecht/Grafiken/Anlage-06/EinkurzerTon.gif?__blob=normal&v=2)
  type: single
  answers:
  - Etwa 1 Sekunde.
  - Etwa 2 Sekunden.
  - Weniger als 1 Sekunde.
  - Weniger als 4 Sekunden.
  correct: A
  explanation: |
    **Anlage 6 BinSchStrO (Schallzeichen, Vorbemerkung)** · [Anlage
    6](https://www.gesetze-im-internet.de/binschstro_2012/anlage_6.html)

    > kurzer Ton: ein Ton von etwa einer Sekunde Dauer;

- question: |-
    Wie lang ist die Dauer eines langen Tons?

    ![Bild zu Frage 5](https://www.elwis.de/DE/Schifffahrtsrecht/Binnenschifffahrtsrecht/Grafiken/Anlage-06/EinlangerTon.gif?__blob=normal&v=2)
  type: single
  answers:
  - Etwa 4 - 6 Sekunden.
  - Etwa 2 - 6 Sekunden.
  - Etwa 1 - 2 Sekunden.
  - Etwa 6 - 8 Sekunden.
  correct: A
  explanation: |
    **Anlage 6 BinSchStrO (Schallzeichen, Vorbemerkung)** · [Anlage
    6](https://www.gesetze-im-internet.de/binschstro_2012/anlage_6.html)

    > langer Ton: ein Ton von etwa vier Sekunden Dauer;

    Die Katalogantwort „etwa 4 – 6 Sekunden“ schließt die gesetzliche Angabe „etwa vier Sekunden“
    ein.

- question: |-
    Welche Bedeutung hat folgendes Schallsignal?

    ![Bild zu Frage 16](https://www.elwis.de/DE/Sportschifffahrt/Sportbootfuehrerscheine/Fragenkatalog-Binnen/Basisfragen/Schallzeichen-Frage-16.gif?__blob=normal&v=1)
  type: single
  answers:
  - Bleib-weg-Signal, Gefahrenbereich sofort verlassen.
  - Allgemeines Gefahr- und Warnsignal.
  - Ankerlieger über 100 m Länge.
  - Manövrierbehinderter Schleppverband über 200 m Länge.
  correct: A
  explanation: |
    **Anlage 6 Abschnitt A BinSchStrO (Bleib-Weg-Signal)** · [Anlage
    6](https://www.gesetze-im-internet.de/binschstro_2012/anlage_6.html)

    > Mindestens 15 Minuten lang ununterbrochene Wiederholung abwechselnd eines kurzen und eines
    > langen Tones in Verbindung mit dem Lichtzeichen nach § 4.01 Nummer 2 „Bleib-Weg-Signal“ § 8.09
    > Nummer 2

