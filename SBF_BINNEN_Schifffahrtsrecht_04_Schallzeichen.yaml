- question: Was ist eine Folge sehr kurzer Töne?
  type: single
  answers:
  - Eine Folge von mindestens 6 Tönen, von je etwa einer viertel Sekunde Dauer und mit je einer viertel
    Sekunde Pause.
  - Eine Folge von mindestens 4 Tönen von je etwa einer viertel Sekunde Dauer und mit je einer viertel
    Sekunde Pause.
  - Eine Folge von mindestens 2 Tönen von je etwa einer viertel Sekunde Dauer und mit je einer viertel
    Sekunde Pause.
  - Eine Folge von mindestens 8 Tönen von je etwa einer viertel Sekunde Dauer und mit je einer viertel
    Sekunde Pause.
  correct: A
  explanation: |
    **Anlage 6 BinSchStrO (Schallzeichen, Vorbemerkung)** · [Anlage
    6](https://www.gesetze-im-internet.de/binschstro_2012/anlage_6.html)

    > Jedoch besteht das Zeichen „Folge von sehr kurzen Tönen“ aus einer Folge von mindestens sechs
    > Tönen je von etwa einer Viertelsekunde Dauer, wobei die Pause zwischen den Tönen ebenso lang
    > ist.

