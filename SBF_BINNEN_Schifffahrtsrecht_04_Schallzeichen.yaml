- question: Welche Schallsignale bzw. Zeichen sind zu geben, wenn das Boot manövrierunfähig geworden ist?
  type: single
  answers:
  - Vier kurze Töne. Bei Tag eine rote Flagge, bei Nacht ein rotes Licht im unteren Halbkreis schwenken.
  - Fünf kurze Töne. Bei Tag eine rote Flagge, bei Nacht ein rotes Licht im oberen Halbkreis schwenken.
  - Ein langer, vier kurze Töne. Bei Tag eine rote Flagge, bei Nacht ein rotes Licht setzen.
  - Eine Gruppe von kurzen und langen Tönen im Intervall geben. Bei Nacht ein rotes Blinklicht einschalten.
  correct: A
  explanation: |
    **§ 3.18 Nr. 1 BinSchStrO (manövrierunfähige Fahrzeuge in Fahrt)** ·
    [§ 3.18](https://www.gesetze-im-internet.de/binschstro_2012/__3_18.html)

    > Ein manövrierunfähiges Fahrzeug in Fahrt muss zusätzlich zu der anderen nach dieser Verordnung
    > vorgeschriebenen Bezeichnung a) bei Nacht: ein rotes Licht zeigen, das im unteren Halbkreis
    > geschwenkt wird; b) bei Tag: eine rote Flagge zeigen, die im unteren Halbkreis geschwenkt
    > wird. Anstelle der Bezeichnung nach Satz 1 kann das vorgeschriebene Schallzeichen gegeben
    > werden oder beides zugleich.

    **Anlage 6 Abschnitt A BinSchStrO (Allgemeine Zeichen)** · [Anlage
    6](https://www.gesetze-im-internet.de/binschstro_2012/anlage_6.html)

    > 4 kurze Töne „Ich bin manövrierunfähig“
