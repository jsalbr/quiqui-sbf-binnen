- question: Für welche Sportboote ist der Sportbootführerschein mit dem Geltungsbereich Binnenschifffahrtsstraßen
    vorgeschrieben?
  type: single
  answers:
  - Für Sportboote von mehr als 11,03 <abbr title="Kilowatt">kW</abbr> (15 <abbr title="Pferdestärke,
    eine veraltete physikalische Maßeinheit für die Leistung">PS</abbr>) Nutzleistung bei Verwendung eines
    Verbrennungsmotors <abbr title="beziehungsweise">bzw.</abbr> 7,5 kW bei Verwendung eines Elektromotors
    Betriebsart <abbr title="Dauerbetrieb mit konstanter Belastung">S1</abbr> (Dauerbetrieb) und weniger
    als 20 m Länge.
  - Für Sportboote von weniger als 11,03 kW (15 PS) Nutzleistung bei Verwendung eines Verbrennungsmotors
    bzw. 7,5 kW bei Verwendung eines Elektromotors Betriebsart S1 (Dauerbetrieb) und mehr als 20 m Länge.
  - Für Sportboote von mehr als 11,03 kW (15 PS) Nutzleistung bei Verwendung eines Verbrennungsmotors
    bzw. 7,5 kW bei Verwendung eines Elektromotors Betriebsart S1 (Dauerbetrieb) und mehr als 20 m Länge.
  - Für Sportboote von weniger als 11,03 kW (15 PS) Nutzleistung bei Verwendung eines Verbrennungsmotors
    bzw. 7,5 kW bei Verwendung eines Elektromotors Betriebsart S1 (Dauerbetrieb) und weniger als 20 m
    Länge.
  correct: A
  explanation: |
    **§ 5 Abs. 1 Nr. 1 SpFV (Ausnahmen) und § 1 Nr. 1 SpFV (Anwendungsbereich)** ·
    [§ 5](https://www.gesetze-im-internet.de/spfv/__5.html) ·
    [§ 1](https://www.gesetze-im-internet.de/spfv/__1.html)

    > Keiner Fahrerlaubnis nach dieser Verordnung bedürfen 1. auf allen Binnenschifffahrtsstraßen
    > und auf den Seeschifffahrtsstraßen Personen beim Führen eines Sportbootes, sofern das zu
    > führende Sportboot mit einer Antriebsmaschine ausgerüstet ist, deren größte nicht
    > überschreitbare Nutzleistung bei Verwendung eines a) Verbrennungsmotors höchstens 11,03
    > Kilowatt, b) Elektromotors höchstens 7,5 Kilowatt in der Betriebsart S1 (Dauerbetrieb) […]
    > beträgt
    >
    > Diese Verordnung gilt 1. auf den Binnenschifffahrtsstraßen für Sportboote von weniger als 20
    > Metern Länge, gemessen ohne Ruder und Bugspriet

    Umkehrschluss: Über 11,03 kW (Verbrennungsmotor) bzw. 7,5 kW (Elektromotor, S1) ist der
    Sportbootführerschein Binnen nötig.

