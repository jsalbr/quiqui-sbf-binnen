- question: Was ist bei der Ausübung des Wassersports auf Gewässern außerhalb der Bundeswasserstraßen
    (<abbr title="zum Beispiel">z. B.</abbr> Landeswasserstraßen, kommunale und private Gewässer) zu beachten?
  type: single
  answers:
  - Es ist gegebenenfalls die Genehmigung des Eigentümers einzuholen sowie die jeweilige Befahrensordnung
    zu beachten.
  - Es ist immer die Genehmigung des Eigentümers einzuholen sowie die jeweilige Befahrensordnung zu beachten.
  - Es ist immer die Genehmigung des Wasserstraßen- und Schifffahrtsamtes einzuholen sowie die jeweilige
    Befahrensordnung zu beachten.
  - Es ist gegebenenfalls die Genehmigung des Eigentümers einzuholen sowie die Binnenschifffahrtsstraßen-Ordnung
    zu beachten.
  correct: A
  explanation: |
    **§ 2 Nr. 1 SpFV (Begriff Binnenschifffahrtsstraßen)** ·
    [Gesetzestext](https://www.gesetze-im-internet.de/spfv/__2.html)

    > Binnenschifffahrtsstraßen: die Bundeswasserstraßen im Sinne des § 1 Absatz 1 Nummer 2 des
    > Binnenschifffahrtsaufgabengesetzes mit Ausnahme der Seeschifffahrtsstraßen und der Elbe im
    > Hamburger Hafen.

    Die SpFV und die BinSchStrO erfassen nur Bundeswasserstraßen. Für Landeswasserstraßen sowie
    kommunale und private Gewässer gelten Landesrecht, Befahrensordnungen und die Zustimmung des
    Eigentümers. Eine einzelne Bundesnorm dafür gibt es nicht.

