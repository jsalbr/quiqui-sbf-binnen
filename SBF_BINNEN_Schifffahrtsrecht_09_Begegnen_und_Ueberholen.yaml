- question: |-
    Welche Bedeutung hat folgendes Tafelzeichen?

    ![Bild zu Frage 18](https://www.elwis.de/DE/Schifffahrtsrecht/Binnenschifffahrtsrecht/Grafiken/Anlage-07/Verbotszeichen-A04.gif?__blob=normal&v=2)
  type: single
  answers:
  - Begegnungsverbot an einer Engstelle.
  - Begegnungsverbot für Fahrzeuge über 12 m Länge.
  - Überholverbot; mit Gegenverkehr muss gerechnet werden.
  - Überholverbot für alle Fahrzeuge.
  correct: A
  explanation: |
    **§ 6.08 Nr. 1 BinSchStrO (verbotenes Begegnen)** ·
    [§ 6.08](https://www.gesetze-im-internet.de/binschstro_2012/__6_08.html)

