- question: Warum soll ein kleines Fahrzeug nicht dicht an ein großes in Fahrt befindliches Fahrzeug heranfahren?
  type: single
  answers:
  - Es kann durch dessen Bug- oder Heckwelle kentern oder durch den Sog mit dem Fahrzeug kollidieren.
  - Dichtes Heranfahren ist ein Verstoß gegen die Grundregeln für das Verhalten im Verkehr.
  - Da es dem großen in Fahrt befindlichen Fahrzeug sonst nicht ausweichen kann.
  - Es kann durch dessen Bug- oder Heckwelle Seeschlag erleiden.
  correct: A
  explanation: |
    **§ 6.17 Nr. 1 und 3 BinSchStrO (Fahrt auf gleicher Höhe)** ·
    [§ 6.17](https://www.gesetze-im-internet.de/binschstro_2012/__6_17.html)

    > Fahrzeuge dürfen nur auf gleicher Höhe fahren, wenn es der verfügbare Raum ohne Störung oder
    > Gefährdung der Schifffahrt gestattet.
    >
    > Das Anlegen oder Anhängen an ein Fahrzeug oder einen Schwimmkörper in Fahrt sowie das
    > Mitfahren im Sogwasser sind ohne ausdrückliche Erlaubnis des Schiffsführers verboten.

    **§ 6.20 Nr. 1 Satz 1 BinSchStrO (Vermeidung von Wellenschlag)** ·
    [§ 6.20](https://www.gesetze-im-internet.de/binschstro_2012/__6_20.html)

    > Ein Fahrzeug muss seine Geschwindigkeit so einrichten, dass Wellenschlag oder Sogwirkungen,
    > die Schäden an einem stillliegenden oder einem in Fahrt befindlichen Fahrzeug oder
    > Schwimmkörper oder an einer Anlage verursachen können, vermieden werden.

- question: Wie verhält man sich beim Begegnen mit anderen Fahrzeugen in einem engen Fahrwasser?
  type: single
  answers:
  - Geschwindigkeit herabsetzen und ausreichenden Passierabstand halten.
  - Geschwindigkeit erhöhen, um das Begegnungsmanöver zügig durchzuführen.
  - Das gegen den Strom fahrende Fahrzeug ist ausweichpflichtig.
  - Das mit dem Strom fahrende Fahrzeug hat aufzustoppen.
  correct: A
  explanation: |
    **§ 6.02 Nr. 1 BinSchStrO (Kleinfahrzeuge gegenüber anderen Fahrzeugen)** ·
    [§ 6.02](https://www.gesetze-im-internet.de/binschstro_2012/__6_02.html)

    > Ein einzeln fahrendes Kleinfahrzeug oder ein Verband, der ausschließlich aus Kleinfahrzeugen
    > besteht, muss […] b) allen übrigen Fahrzeugen den für deren Kurs und zum Manövrieren
    > notwendigen Raum lassen. Ein Kleinfahrzeug oder ein Verband im Sinne des Satzes 1 kann nicht
    > verlangen, dass ein Fahrzeug ihm ausweicht.

    **§ 6.20 Nr. 1 BinSchStrO (Vermeidung von Wellenschlag)** ·
    [§ 6.20](https://www.gesetze-im-internet.de/binschstro_2012/__6_20.html)

    > Es muss seine Geschwindigkeit rechtzeitig vermindern, jedoch nicht unter das Maß, das zu
    > seiner sicheren Steuerung notwendig ist

    Die Begegnungsregeln [§ 6.07](https://www.gesetze-im-internet.de/binschstro_2012/__6_07.html)
    (enges Fahrwasser) gelten nicht für Kleinfahrzeuge. Für sie gelten diese Vorsorgepflichten und
    [§ 1.04](https://www.gesetze-im-internet.de/binschstro_2012/__1_04.html).

- question: Welche Gefahren können entstehen, wenn ein kleines von einem größeren Fahrzeug überholt wird?
  type: single
  answers:
  - Das kleinere Fahrzeug kann durch Stau, Sog oder Schwell aus dem Kurs laufen und kollidieren oder querschlagen,
    in flachen Gewässern auf Grund laufen.
  - Das größere Fahrzeug kann durch Stau, Sog oder Schwell aus dem Kurs laufen und kollidieren oder querschlagen,
    in flachen Gewässern auf Grund laufen.
  - Das kleinere Fahrzeug kann durch Stau, Sog oder Schwell aus dem Kurs laufen und kollidieren oder kentern,
    in flachen Gewässern extrem versetzt werden.
  - Das größere Fahrzeug kann durch Wellenbildung aus dem Kurs laufen und kollidieren oder querschlagen,
    in flachen Gewässern auf Grund laufen.
  correct: A
  explanation: |
    **§ 6.20 Nr. 1 Satz 1 BinSchStrO (Vermeidung von Wellenschlag)** ·
    [§ 6.20](https://www.gesetze-im-internet.de/binschstro_2012/__6_20.html)

    > Ein Fahrzeug muss seine Geschwindigkeit so einrichten, dass Wellenschlag oder Sogwirkungen,
    > die Schäden an einem stillliegenden oder einem in Fahrt befindlichen Fahrzeug oder
    > Schwimmkörper oder an einer Anlage verursachen können, vermieden werden.

    **§ 1.04 BinSchStrO (Allgemeine Sorgfaltspflicht)** ·
    [§ 1.04](https://www.gesetze-im-internet.de/binschstro_2012/__1_04.html)

    > Über die Anforderungen nach dieser Verordnung hinaus hat jeder Verkehrsteilnehmer auf
    > Binnenschifffahrtsstraßen alle Vorsichtsmaßnahmen zu treffen, welche die allgemeine
    > Sorgfaltspflicht und die Übung der Schifffahrt gebieten, um insbesondere 1. die Gefährdung von
    > Menschenleben zu vermeiden,

- question: Wie ist ein Überholmanöver durchzuführen?
  type: single
  answers:
  - Zügig überholen. Beteiligte Fahrzeuge nicht behindern. Verkehrslage und eventuelle Schallzeichen beachten.
    Ausreichend Abstand halten.
  - Zügig überholen. Gegebenenfalls das Fahrzeug stark beschleunigen, um schnell passieren zu können.
  - Zügig überholen; überholen nur auf der Steuerbordseite erlaubt, ausreichend Abstand halten.
  - Zügig überholen. Dicht am Ufer entlang fahren, eventuelle Schallzeichen müssen von Kleinfahrzeugen
    beachtet werden.
  correct: A
  explanation: |
    **§ 6.09 Nr. 1 BinSchStrO (Überholen)** ·
    [§ 6.09](https://www.gesetze-im-internet.de/binschstro_2012/__6_09.html)

    > Das Überholen ist nur gestattet, nachdem sich der Überholende vergewissert hat, dass dieses
    > Manöver ohne Gefahr ausgeführt werden kann.

    **§ 6.03 Nr. 1 BinSchStrO (Allgemeine Grundsätze)** ·
    [§ 6.03](https://www.gesetze-im-internet.de/binschstro_2012/__6_03.html)

    > Das Begegnen, Kreuzen oder Überholen ist nur gestattet, wenn das Fahrwasser unter
    > Berücksichtigung aller örtlichen Umstände und des übrigen Verkehrs hinreichenden Raum für die
    > Vorbeifahrt gewährt.

    **§ 6.10 Nr. 1 BinSchStrO (Verhalten beim Überholen)** ·
    [§ 6.10](https://www.gesetze-im-internet.de/binschstro_2012/__6_10.html)

    > Der Überholende darf an Backbord oder an Steuerbord des Vorausfahrenden überholen. Ist das
    > Überholen möglich, ohne dass der Vorausfahrende seinen Kurs zu ändern braucht, gibt der
    > Überholende kein Schallzeichen.

    § 6.10 gilt nicht für Kleinfahrzeuge ([§ 6.02](https://www.gesetze-im-internet.de/binschstro_2012/__6_02.html)). Sie können nach [§ 4.02](https://www.gesetze-im-internet.de/binschstro_2012/__4_02.html) die allgemeinen
    Schallzeichen geben.
