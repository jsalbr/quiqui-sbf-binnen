- question: |-
    Welche Bedeutung hat folgendes Tafelzeichen?

    ![Bild zu Frage 22](https://www.elwis.de/DE/Schifffahrtsrecht/Binnenschifffahrtsrecht/Grafiken/Anlage-07/Verbotszeichen-A06.gif?__blob=normal&v=2)
  type: single
  answers:
  - Ankern verboten für alle Fahrzeuge.
  - Ankern verboten für Kleinfahrzeuge unter 12 m Länge.
  - Ankern verboten für Kleinfahrzeuge ab 12 m Länge.
  - Ankern und Festmachen verboten.
  correct: A
  explanation: |
    **Anlage 7 Abschnitt I A.6 BinSchStrO (Ankerverbot)** · [Anlage
    7](https://www.gesetze-im-internet.de/binschstro_2012/anlage_7.html)

    > A.6 Ankerverbot und Verbot des Schleifenlassens von Ankern, Trossen oder Ketten auf der Seite
    > der Wasserstraße, auf der das Tafelzeichen steht

    **§ 7.03 Nr. 1 Buchstabe b BinSchStrO (Ankern)** ·
    [§ 7.03](https://www.gesetze-im-internet.de/binschstro_2012/__7_03.html)

    > Ein Fahrzeug, ein Schwimmkörper oder eine schwimmende Anlage darf nicht ankern: […] b) auf
    > einer durch das Tafelzeichen A.6 (Anlage 7) gekennzeichneten Strecke, auf der Seite der
    > Wasserstraße, auf der das Tafelzeichen steht; das Ankerverbot gilt von 50,00 m oberhalb bis
    > 50,00 m unterhalb des Tafelzeichens.

- question: |-
    Welche Bedeutung haben folgende Tafelzeichen?

    ![Bild zu Frage 23](https://www.elwis.de/DE/Schifffahrtsrecht/Binnenschifffahrtsrecht/Grafiken/Anlage-07/Verbotszeichen-A07.gif?__blob=normal&v=2)
  type: single
  answers:
  - Festmache- und Liegeverbot.
  - Festmache- und Liegeverbot für Sportboote.
  - Festmache- und Liegeverbot für Sportboote über 12 m Länge.
  - Festmache- und Liegeverbot für gewerbliche Schiffe.
  correct: A
  explanation: |
    **Anlage 7 Abschnitt I A.5 und A.7 BinSchStrO (Stillliege- und Festmacheverbot)** · [Anlage
    7](https://www.gesetze-im-internet.de/binschstro_2012/anlage_7.html)

    > A.5 Stillliegeverbot auf der Seite der Wasserstraße, auf der das Tafelzeichen steht
    >
    > A.7 Festmacheverbot am Ufer auf der Seite der Wasserstraße, auf der das Tafelzeichen steht

    **§ 7.04 Nr. 1 Buchstabe b BinSchStrO (Festmachen)** ·
    [§ 7.04](https://www.gesetze-im-internet.de/binschstro_2012/__7_04.html)

    > Ein Fahrzeug, ein Schwimmkörper oder eine schwimmende Anlage darf am Ufer nicht festmachen:
    > […] b) auf einer durch das Tafelzeichen A.7 (Anlage 7) gekennzeichneten Strecke auf der Seite
    > der Wasserstraße, auf der das Tafelzeichen steht.

- question: Wo finden Sie Informationen über umweltfreundliche Farben, Lacke und Antifouling-Beschichtungen
    für Ihr Boot?
  type: single
  answers:
  - Beim Umweltbundesamt.
  - Beim Bundesministerium für Digitales und Verkehr.
  - In der Sportbootführerscheinverordnung.
  - In der Sportbootvermietungsverordnung.
  correct: A
  explanation: |
    Eine Rechtsvorschrift mit dieser Auskunftsstelle gibt es nicht. Maßgeblich ist die allgemeine
    Sorgfaltspflicht:

    **§ 1.04 Nr. 4 BinSchStrO (Allgemeine Sorgfaltspflicht)** ·
    [§ 1.04](https://www.gesetze-im-internet.de/binschstro_2012/__1_04.html)

    > jede vermeidbare Beeinträchtigung der Umwelt zu verhindern.

- question: Woran kann man erkennen, ob der Anker hält?
  type: single
  answers:
  - Wenn beim Handauflegen auf die Ankerkette oder -leine kein Rucken zu verspüren ist und sich die Ankerpeilung
    nicht ändert.
  - Wenn Ankerkette oder -leine nicht vibrieren und sich der anliegende Magnetkompasskurs nicht verändert.
  - Wenn beim Handauflegen auf die Ankerkette oder -leine kein Rucken zu verspüren ist und das Fahrzeug
    nicht schwojt.
  - Wenn beim Handauflegen auf die Ankerkette oder -leine kein Rucken zu verspüren ist und sich die Ankerpeilung
    ändert.
  correct: A
  explanation: |
    **§ 7.01 Nr. 3 BinSchStrO (Allgemeine Grundsätze für das Stillliegen)** ·
    [§ 7.01](https://www.gesetze-im-internet.de/binschstro_2012/__7_01.html)

    > Ein stillliegendes Fahrzeug, ein stillliegender Schwimmkörper oder eine stillliegende
    > schwimmende Anlage muss so verankert oder festgemacht werden, dass seine oder ihre Lage nicht
    > in einer Weise verändert werden kann, die ein anderes Fahrzeug, oder einen anderen
    > Schwimmkörper gefährdet oder behindert.

    Die beschriebene Ankerprobe (Handauflegen, Ankerpeilung) ist seemännische Praxis und steht nicht
    im Gesetz.

- question: Was ist in Kanälen verboten?
  type: single
  answers:
  - Ankern.
  - Wenden.
  - Überholen.
  - Begegnen.
  correct: A
  explanation: |
    **§ 7.03 Nr. 1 Buchstabe a BinSchStrO (Ankern)** ·
    [§ 7.03](https://www.gesetze-im-internet.de/binschstro_2012/__7_03.html)

    > Ein Fahrzeug, ein Schwimmkörper oder eine schwimmende Anlage darf nicht ankern: a) auf einem
    > Schifffahrtskanal, in einem Schleusenkanal oder auf dem Abschnitt einer Wasserstraße, für den
    > ein allgemeines Ankerverbot besteht;

- question: |-
    Was bedeutet dieses Tafelzeichen?

    ![Bild zu Frage 107](https://www.elwis.de/DE/Schifffahrtsrecht/Binnenschifffahrtsrecht/Grafiken/Anlage-07/Hinweiszeichen-E057.gif?__blob=normal&v=2)
  type: single
  answers:
  - Liegestelle für Fahrzeuge mit explosiven Stoffen, für Kleinfahrzeuge verboten.
  - Liegestelle für Fahrzeuge mit brennbaren Stoffen, für Kleinfahrzeuge verboten.
  - Liegestelle für Fahrzeuge mit gesundheitsgefährdeten Stoffen, für Kleinfahrzeuge verboten.
  - Liegestelle für alle Fahrzeuge, für Kleinfahrzeuge verboten.
  correct: A
  explanation: |
    **Anlage 7 Abschnitt I E.5.7 BinSchStrO (Liegestelle)** · [Anlage
    7](https://www.gesetze-im-internet.de/binschstro_2012/anlage_7.html)

    > E.5.7 Liegestelle für ein Fahrzeug der Schubschifffahrt, das die Bezeichnung nach § 3.14
    > Nummer 3 führen muss

    **§ 7.06 Nr. 1 BinSchStrO (Besondere Liegestellen)** ·
    [§ 7.06](https://www.gesetze-im-internet.de/binschstro_2012/__7_06.html)

    > Auf einer Liegestelle, bei der eines der Tafelzeichen E.5.4 bis E.5.15 (Anlage 7) aufgestellt
    > ist, darf nur die Fahrzeugart stillliegen, für die das Tafelzeichen gilt.

    **§ 3.14 Nr. 3 BinSchStrO (explosive Stoffe)** ·
    [§ 3.14](https://www.gesetze-im-internet.de/binschstro_2012/__3_14.html)

    > Ein Fahrzeug in Fahrt, das bestimmte explosive Stoffe nach Kapitel 3.2 Tabelle A des ADN
    > befördert, […] a) bei Nacht: drei blaue Lichter; b) bei Tag: drei blaue Kegel mit der Spitze
    > nach unten.

- question: |-
    Was bedeuten diese Tafelzeichen?

    ![Bild zu Frage 108](https://www.elwis.de/DE/Schifffahrtsrecht/Binnenschifffahrtsrecht/Grafiken/Anlage-07/Hinweiszeichen-E0512.gif?__blob=normal&v=2)
  type: single
  answers:
  - Liegestelle für Fahrzeuge ohne gefährliche Güter, auch für Kleinfahrzeuge.
  - Liegestelle für Fahrzeuge ohne gefährliche Güter, nicht für Kleinfahrzeuge.
  - Liegestelle für Fahrzeuge mit gefährlichen Gütern, auch für Kleinfahrzeuge.
  - Liegestelle für Fahrzeuge mit gefährlichen Gütern, nicht für Kleinfahrzeuge.
  correct: A
  explanation: |
    **Anlage 7 Abschnitt I E.5.12 BinSchStrO (Liegestelle)** · [Anlage
    7](https://www.gesetze-im-internet.de/binschstro_2012/anlage_7.html)

    > E.5.12 Liegestelle für ein Fahrzeug, das keine Bezeichnung nach § 3.14 führen muss

    **§ 7.06 Nr. 1 BinSchStrO (Besondere Liegestellen)** ·
    [§ 7.06](https://www.gesetze-im-internet.de/binschstro_2012/__7_06.html)

    > Auf einer Liegestelle, bei der eines der Tafelzeichen E.5.4 bis E.5.15 (Anlage 7) aufgestellt
    > ist, darf nur die Fahrzeugart stillliegen, für die das Tafelzeichen gilt.

- question: Wo besteht ohne besondere Bezeichnung der Stellen bzw. Strecken ein allgemeines Liegeverbot?
  type: single
  answers:
  - Auf Schifffahrtskanälen und Schleusenkanälen.
  - Auf Schifffahrtskanälen und vor Schleusenkanälen.
  - Vor Brücken und Hochspannungsleitungen.
  - Vor Brücken und nach Hochspannungsleitungen.
  correct: A
  explanation: |
    **§ 7.02 Nr. 1 Buchstabe a BinSchStrO (Liegeverbot)** ·
    [§ 7.02](https://www.gesetze-im-internet.de/binschstro_2012/__7_02.html)

    > Ein Fahrzeug, ein Schwimmkörper oder eine schwimmende Anlage darf nicht stillliegen: a) auf
    > einem Schifffahrtskanal, in einem Schleusenkanal oder auf einem Abschnitt der Wasserstraße,
    > für den ein allgemeines Stillliegeverbot besteht;
