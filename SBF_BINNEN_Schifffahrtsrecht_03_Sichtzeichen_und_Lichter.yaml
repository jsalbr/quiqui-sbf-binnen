- question: Wann gilt ein Fahrzeug unter Segel als Maschinenfahrzeug?
  type: single
  answers:
  - Wenn es gleichzeitig mit Maschinenkraft fährt.
  - Wenn es mit einer Antriebsmaschine ausgerüstet ist.
  - Wenn es durch das Segeln keine Fahrt durchs Wasser macht.
  - Wenn es durch das Segeln keine Fahrt über Grund macht.
  correct: A
  explanation: |
    **§ 1.01 Nr. 15 BinSchStrO (Fahrzeug unter Segel)** · [§ 1.01](https://www.gesetze-im-internet.de/binschstro_2012/__1_01.html)

    > „Fahrzeug unter Segel“: ein Fahrzeug, das nur unter Segel fährt; ein Fahrzeug, das unter Segel
    > fährt und gleichzeitig eine Antriebsmaschine benutzt, gilt als Fahrzeug mit Maschinenantrieb;

- question: Welches Signal führt ein Fahrzeug unter Segel, das als Maschinenfahrzeug gilt, zusätzlich
    am Tage?
  type: single
  answers:
  - Einen schwarzen Kegel, Spitze unten.
  - Einen schwarzen Kegel, Spitze oben.
  - Einen schwarzen Rhombus.
  - Zwei schwarze Bälle senkrecht übereinander.
  correct: A
  explanation: |
    **§ 3.13 Nr. 6 BinSchStrO (Kleinfahrzeug unter Segel mit Maschinenantrieb)** · [§ 3.13](https://www.gesetze-im-internet.de/binschstro_2012/__3_13.html)

    > Ein Kleinfahrzeug unter Segel, das gleichzeitig mit Maschinenantrieb fährt, muss bei Tag einen
    > schwarzen Kegel mit der Spitze nach unten, so hoch wie möglich an einer Stelle, an der er am
    > besten sichtbar ist, führen.

- question: Wann müssen die Lichter von Fahrzeugen geführt oder gezeigt werden?
  type: single
  answers:
  - Von Sonnenuntergang bis Sonnenaufgang und bei verminderter Sicht.
  - Von Sonnenaufgang bis Sonnenuntergang und bei verminderter Sicht.
  - Von abends 18:00 Uhr bis morgens 06:00 Uhr und bei verminderter Sicht.
  - Bei Dunkelheit, schlechtem Wetter und verminderter Sicht.
  correct: A
  explanation: |
    **§ 1.01 Nr. 29 BinSchStrO (Nacht)** · [§ 1.01](https://www.gesetze-im-internet.de/binschstro_2012/__1_01.html)

    > „Nacht“: der Zeitraum zwischen Sonnenuntergang und Sonnenaufgang;

    **§ 3.01 Nr. 2 BinSchStrO (Lichter bei Sichtverhältnissen)** · [§ 3.01](https://www.gesetze-im-internet.de/binschstro_2012/__3_01.html)

    > Wenn es die Sichtverhältnisse erfordern, müssen die für die Nacht vorgeschriebenen Lichter
    > zusätzlich bei Tag gesetzt werden.

- question: Wozu dient die Lichterführung?
  type: single
  answers:
  - Sie zeigt Fahrtrichtung und Lage eines Fahrzeugs an.
  - Sie zeigt Kurs und Geschwindigkeit eines Fahrzeugs an.
  - Sie zeigt Fahrtrichtung und Position eines Fahrzeugs an.
  - Sie zeigt Fahrtrichtung und Kurs eines Fahrzeugs an.
  correct: A
  explanation: |
    Eine eigene Rechtsnorm mit dieser Formulierung gibt es nicht. Die Lichterführung nach Kapitel 3
    BinSchStrO ([§ 3.08](https://www.gesetze-im-internet.de/binschstro_2012/__3_08.html)) macht
    Art, Fahrtrichtung und Lage eines Fahrzeugs für andere erkennbar. Das ergibt sich aus der Bauart
    der vorgeschriebenen Lichter:

    **§ 3.01 Nr. 1 BinSchStrO (Topplicht, Seitenlichter, Hecklicht)** ·
    [§ 3.01](https://www.gesetze-im-internet.de/binschstro_2012/__3_01.html)

    > „Topplicht“: ein weißes starkes Licht, das über einen Horizontbogen von 225°, und zwar von
    > Voraus bis beiderseits 22°30’ hinter die Querlinie, und das nur in diesem Bogen sichtbar ist;

- question: Was für eine Laterne kann ein Segelfahrzeug von weniger als 20 <abbr title="Meter">m</abbr>
    Länge anstelle der Seitenlichter und des Hecklichtes führen?
  type: single
  answers:
  - Eine Dreifarbenlaterne an oder nahe der Mastspitze.
  - Eine Zweifarbenlaterne an gut sichtbarer Stelle.
  - Eine Dreifarbenlaterne an gut sichtbarer Stelle.
  - Eine Zweifarbenlaterne an oder nahe der Mastspitze.
  correct: A
  explanation: |
    **§ 3.13 Nr. 4 BinSchStrO (Kleinfahrzeug unter Segel)** · [§ 3.13](https://www.gesetze-im-internet.de/binschstro_2012/__3_13.html)

    > Ein einzeln fahrendes Kleinfahrzeug unter Segel muss bei Nacht führen: entweder a) die
    > Seitenlichter nach Nummer 1 Buchstabe e und ein Hecklicht oder b) diese Seitenlichter und das
    > Hecklicht in einer einzigen Laterne am Topp oder c) ein von allen Seiten sichtbares weißes
    > gewöhnliches Licht und bei der Annäherung anderer Fahrzeuge außerdem ein zweites weißes
    > gewöhnliches Licht zeigen.

- question: Welche Lichter muss ein Fahrzeug unter Segel, das gleichzeitig mit Maschinenkraft fährt, führen?
  type: single
  answers:
  - Die für ein Maschinenfahrzeug vorgeschriebenen Lichter.
  - Die für ein Segelfahrzeug vorgeschriebenen Lichter.
  - Zwei rote Rundumlichter senkrecht übereinander.
  - Seitenlichter rot und grün und ein rotes Rundumlicht.
  correct: A
  explanation: |
    **§ 1.01 Nr. 15 BinSchStrO (Fahrzeug unter Segel)** · [§ 1.01](https://www.gesetze-im-internet.de/binschstro_2012/__1_01.html)

    > „Fahrzeug unter Segel“: ein Fahrzeug, das nur unter Segel fährt; ein Fahrzeug, das unter Segel
    > fährt und gleichzeitig eine Antriebsmaschine benutzt, gilt als Fahrzeug mit Maschinenantrieb;

    **§ 3.13 Nr. 1 BinSchStrO (Kleinfahrzeug mit Maschinenantrieb)** · [§ 3.13](https://www.gesetze-im-internet.de/binschstro_2012/__3_13.html)

    > Ein einzeln fahrendes Kleinfahrzeug mit Maschinenantrieb muss bei Nacht führen: […]
    > Seitenlichter, die gewöhnliche Lichter sein dürfen; […] ein Hecklicht

- question: Was bedeuten auf einem stillliegenden Fahrzeug zwei weiße Lichter übereinander?
  type: single
  answers:
  - Ein Ankerlieger, dessen Anker die Schifffahrt gefährden kann.
  - Ein stillliegender Schubverband.
  - Ein Ankerlieger, der zwei Anker ausgelegt hat.
  - Ein Fahrzeug über 135 m.
  correct: A
  explanation: |
    **§ 3.26 Nr. 1 BinSchStrO (Anker, die die Schifffahrt gefährden können)** · [§ 3.26](https://www.gesetze-im-internet.de/binschstro_2012/__3_26.html)

    > Ein stillliegendes Fahrzeug, dessen Anker so ausgeworfen sind, dass ein Anker, ein Ankerkabel
    > oder eine Ankerkette die Schifffahrt gefährden kann, muss zusätzlich zu der anderen nach
    > dieser Verordnung vorgeschriebenen Bezeichnung bei Nacht führen: ein von allen Seiten
    > sichtbares zusätzliches weißes gewöhnliches Licht 1,00 m unter dem Licht nach § 3.20 Nummer 1

- question: Welches Licht setzt ein stillliegendes Fahrzeug?
  type: single
  answers:
  - Ein von allen Seiten sichtbares weißes Rundumlicht auf der Fahrwasserseite.
  - Ein weißes Topplicht und ein weißes Hecklicht.
  - Die Seitenlichter und ein sichtbares weißes Rundumlicht.
  - Ein von allen Seiten sichtbares weißes Blinklicht auf der Fahrwasserseite.
  correct: A
  explanation: |
    **§ 3.20 Nr. 1 BinSchStrO (Bezeichnung beim Stillliegen)** · [§ 3.20](https://www.gesetze-im-internet.de/binschstro_2012/__3_20.html)

    > Mit Ausnahme eines Kleinfahrzeugs und der in den §§ 3.22 und 3.25 genannten Fahrzeuge muss ein
    > Fahrzeug beim Stillliegen bei Nacht ein von allen Seiten sichtbares weißes gewöhnliches Licht
    > auf der Fahrwasserseite mindestens 3,00 m über der Ebene der Einsenkungsmarken führen.

- question: Wie sind Anker am Tage bezeichnet, die die Schifffahrt behindern können?
  type: single
  answers:
  - Mit einem gelben Döpper.
  - Mit einem weißen Döpper.
  - Mit einem grünen Döpper.
  - Mit einem roten Döpper.
  correct: A
  explanation: |
    **§ 3.26 Nr. 3 BinSchStrO (Anker mit Döpper)** · [§ 3.26](https://www.gesetze-im-internet.de/binschstro_2012/__3_26.html)

    > In den Fällen der Nummern 1 und 2 ist jeder dieser Anker mit einem gelben Döpper mit
    > Radarreflektor zu bezeichnen.

