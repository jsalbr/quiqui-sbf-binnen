- question: Was bedeutet auf einem Fahrzeug ein blaues Licht?
  type: single
  answers:
  - Fahrzeug hat brennbare Stoffe geladen. Abstand beim Stillliegen 10 m.
  - Fahrzeug hat gesundheitsschädliche Stoffe geladen. Abstand beim Stillliegen 50 m.
  - Fahrzeug hat explosive Stoffe geladen. Abstand beim Stillliegen 100 m.
  - Fahrzeug der Überwachungsbehörden im Einsatz.
  correct: A
  explanation: |
    **§ 3.14 Nr. 1 BinSchStrO (entzündbare Stoffe)** · [§ 3.14](https://www.gesetze-im-internet.de/binschstro_2012/__3_14.html)

    > Ein Fahrzeug in Fahrt, das bestimmte entzündbare Stoffe nach Kapitel 3.2 Tabelle A des ADN
    > befördert, muss zusätzlich zu der anderen nach dieser Verordnung vorgeschriebenen Bezeichnung
    > folgende Bezeichnung nach den Unterabschnitten 7.1.5.0 oder 7.2.5.0 des ADN führen: a) bei
    > Nacht: ein blaues Licht

    **§ 7.07 Nr. 1 BinSchStrO (Mindestabstände beim Stillliegen)** ·
    [§ 7.07](https://www.gesetze-im-internet.de/binschstro_2012/__7_07.html)

    > Zu einem Fahrzeug, zu einem Schubverband oder zu gekuppelten Fahrzeugen müssen beim
    > Stillliegen ein Fahrzeug, ein Schubverband oder gekuppelte Fahrzeuge folgende Mindestabstände
    > einhalten: a) 10,00 m, wenn eines oder einer von ihnen die Bezeichnung nach § 3.14 Nummer 1
    > führt; b) 50,00 m, wenn eines oder einer von ihnen die Bezeichnung nach § 3.14 Nummer 2 führt;
    > c) 100,00 m, wenn eines oder einer von ihnen die Bezeichnung nach § 3.14 Nummer 3 führt.

