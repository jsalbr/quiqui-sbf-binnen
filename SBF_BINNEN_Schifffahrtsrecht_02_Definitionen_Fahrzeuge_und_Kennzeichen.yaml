- question: Wann ist ein Fahrzeug in Fahrt?
  type: single
  answers:
  - Wenn es weder vor Anker liegt noch an Land festgemacht ist noch auf Grund sitzt.
  - Wenn es weder vor Anker liegt noch an Land festgemacht ist noch Fahrt über Grund macht.
  - Wenn es weder auf Grund sitzt noch vor Anker liegt noch manövrierbehindert oder manövrierunfähig ist.
  - Wenn es weder an Land festgemacht ist noch vor Anker liegt noch Fahrt durchs Wasser macht.
  correct: A
  explanation: |
    **§ 1.01 Nr. 24 BinSchStrO (in Fahrt befindlich)** ·
    [§ 1.01](https://www.gesetze-im-internet.de/binschstro_2012/__1_01.html)

    > „fahrend“ oder „in Fahrt befindlich“: ein Fahrzeug, ein Schwimmkörper oder eine schwimmende
    > Anlage, das, der oder die weder unmittelbar noch mittelbar ankert, unmittelbar noch mittelbar
    > am Ufer festgemacht ist oder festgefahren ist;

- question: Wann gilt ein Fahrzeug unter Segel als Maschinenfahrzeug?
  type: single
  answers:
  - Wenn es gleichzeitig mit Maschinenkraft fährt.
  - Wenn es mit einer Antriebsmaschine ausgerüstet ist.
  - Wenn es durch das Segeln keine Fahrt durchs Wasser macht.
  - Wenn es durch das Segeln keine Fahrt über Grund macht.
  correct: A
  explanation: |
    **§ 1.01 Nr. 15 BinSchStrO (Fahrzeug unter Segel)** ·
    [§ 1.01](https://www.gesetze-im-internet.de/binschstro_2012/__1_01.html)

    > „Fahrzeug unter Segel“: ein Fahrzeug, das nur unter Segel fährt; ein Fahrzeug, das unter Segel
    > fährt und gleichzeitig eine Antriebsmaschine benutzt, gilt als Fahrzeug mit Maschinenantrieb;

- question: Wann gilt ein Sportboot auf den Binnenschifffahrtsstraßen nicht mehr als Kleinfahrzeug?
  type: single
  answers:
  - Wenn es 20 m oder länger ist.
  - Wenn es 15 m oder länger ist.
  - Wenn es 10 m oder länger ist.
  - Wenn es 18 m oder länger ist.
  correct: A
  explanation: |
    **§ 1.01 Nr. 14 BinSchStrO (Kleinfahrzeug)** ·
    [§ 1.01](https://www.gesetze-im-internet.de/binschstro_2012/__1_01.html)

    > „Kleinfahrzeug“: ein Fahrzeug, dessen Schiffskörper, ohne Ruder und Bugspriet, eine größte
    > Länge von weniger als 20,00 m aufweist, einschließlich Segelsurfbrett, Amphibienfahrzeug,
    > Luftkissenfahrzeug und Tragflügelboot, ausgenommen […]

- question: Welche Sichtbeeinträchtigungen führen zu unsichtigem Wetter?
  type: single
  answers:
  - Nebel, Schneefall, starker Regen.
  - Dunkelheit, Nebel, Schneefall, starker Regen.
  - Nacht, Schneefall, starker Regen.
  - Dämmerung, Nebel, Schneefall, starker Regen.
  correct: A
  explanation: |
    **§ 1.01 Nr. 28 BinSchStrO (unsichtiges Wetter)** ·
    [§ 1.01](https://www.gesetze-im-internet.de/binschstro_2012/__1_01.html)

    > „unsichtiges Wetter“: ein Zustand, bei dem die Sicht durch Nebel, Schneefall, heftige
    > Regengüsse oder andere ähnliche Ursachen eingeschränkt ist;

- question: Welche Kennzeichnungsarten für Sportboote gibt es?
  type: single
  answers:
  - Amtliche Kennzeichen und amtlich anerkannte Kennzeichen.
  - Nur amtliche Kennzeichen.
  - Nur amtlich anerkannte Kennzeichen.
  - Kennzeichen gemäß Konformitätserklärung (<span lang="fr"><abbr title="Conformité Européenne">CE</abbr></span>-Zeichen).
  correct: A
  explanation: |
    **§ 2 Abs. 1 KlFzKV-BinSch (Kennzeichnungspflicht)** ·
    [Gesetzestext](https://www.gesetze-im-internet.de/klfzkv-binsch/__2.html)

    > Der Schiffsführer darf ein deutsches Kleinfahrzeug auf den Binnenschiffahrtsstraßen nur
    > führen, wenn es mit einem gültigen amtlichen oder amtlich anerkannten (§ 5) Kennzeichen nach
    > Absatz 3 Satz 1 versehen ist.

- question: Welche Stelle ist für die Zuteilung eines amtlichen Kennzeichens für Sportboote zuständig?
  type: single
  answers:
  - Jedes Wasserstraßen- und Schifffahrtsamt.
  - Der Deutsche Motoryachtverband.
  - Der Deutsche Segler-Verband.
  - Der Allgemeine Deutsche Automobilclub.
  correct: A
  explanation: |
    **§ 8 Abs. 1 KlFzKV-BinSch (Zuteilung des Kennzeichens)** ·
    [Gesetzestext](https://www.gesetze-im-internet.de/klfzkv-binsch/__8.html)

    > Das Wasserstraßen- und Schifffahrtsamt teilt das amtliche Kennzeichen zu.

- question: Woraus bestehen die amtlich anerkannten Kennzeichen?
  type: single
  answers:
  - Nummer des Internationalen Bootsscheins, gefolgt vom Kennbuchstaben für die ausstellende Organisation.
  - Nummer des Binnenschiffsregisters, gefolgt vom Kennbuchstaben für die ausstellende Organisation.
  - Nummer des Seeschiffsregisters, gefolgt vom Kennbuchstaben für die ausstellende Organisation.
  - Die europäische Schiffsnummer, gefolgt vom Kennbuchstaben für die ausstellende Organisation.
  correct: A
  explanation: |
    **§ 5 Satz 1 KlFzKV-BinSch (amtlich anerkannte Kennzeichen)** ·
    [Gesetzestext](https://www.gesetze-im-internet.de/klfzkv-binsch/__5.html)

    > Ein Kennzeichen gilt als amtlich anerkannt, wenn es aus der Nummer des Internationalen
    > Bootsscheines für Wassersportfahrzeuge (Resolution Nr. 13 rev. ECE, Verkehrsblatt 1989 S.
    > 120), gefolgt von dem Kennbuchstaben der zuteilenden Organisation besteht.

- question: Welche Stellen sind für die Zuteilung eines amtlich anerkannten Kennzeichens für Sportboote
    zuständig?
  type: single
  answers:
  - Der Deutsche Motoryachtverband, der Deutsche Segler-Verband, der Allgemeine Deutsche Automobilclub.
  - Die Wasserstraßen- und Schifffahrtsämter.
  - Die Wasserschutzpolizei.
  - Amtsgerichte, bei denen ein Schiffsregister geführt wird.
  correct: A
  explanation: |
    **§ 5 Satz 2 und § 8 Abs. 3 KlFzKV-BinSch** ·
    [§ 5](https://www.gesetze-im-internet.de/klfzkv-binsch/__5.html) ·
    [§ 8](https://www.gesetze-im-internet.de/klfzkv-binsch/__8.html)

    > Dabei erhalten der Deutsche Motoryachtverband e. V. den Kennbuchstaben M, der Deutsche
    > Segler-Verband e. V. den Kennbuchstaben S und der Allgemeine Deutsche Automobilclub e. V. den
    > Kennbuchstaben A.
    >
    > Die in § 5 Satz 2 genannten Organisationen teilen das amtlich anerkannte Kennzeichen zu.

- question: Wann muss ein Wassersportfahrzeug in das Binnenschiffsregister eingetragen werden?
  type: single
  answers:
  - Ab 10 <abbr title="Kubikmeter">cbm</abbr> Wasserverdrängung.
  - Ab 15 cbm Wasserverdrängung.
  - Ab 10 m Schiffslänge.
  - Ab 15 m Schiffslänge.
  correct: A
  explanation: |
    **§ 10 Abs. 2 Nr. 2 Schiffsregisterordnung** ·
    [Gesetzestext](https://www.gesetze-im-internet.de/schrego/__10.html)

    > Zur Anmeldung eines Binnenschiffs ist der Eigentümer verpflichtet, […] wenn das Schiff nicht
    > zur Beförderung von Gütern bestimmt ist und seine Wasserverdrängung bei größter Eintauchung
    > mindestens 10 Kubikmeter beträgt

