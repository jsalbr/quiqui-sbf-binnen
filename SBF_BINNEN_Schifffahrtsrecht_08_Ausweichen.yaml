- question: Ein Segelboot gerät in das Feld einer Segelregatta, ohne selbst Teilnehmer zu sein. Welche
    Ausweichregeln sind zu beachten?
  type: single
  answers:
  - Die der Binnenschifffahrtsstraßen-Ordnung.
  - Die der Wettsegelbestimmungen.
  - Gegenüber Regattateilnehmern, die der Wettfahrtregeln, gegenüber anderen Fahrzeugen die der Binnenschifffahrtsstraßen-Ordnung.
  - Fahrzeuge, die an einer Regatta teilnehmen, müssen unbeteiligten Fahrzeugen ausweichen.
  correct: A
  explanation: |
    **§ 1.23 BinSchStrO (Erlaubnis besonderer Veranstaltungen)** ·
    [§ 1.23](https://www.gesetze-im-internet.de/binschstro_2012/__1_23.html)

    > Eine sportliche Veranstaltung, Wasserfestlichkeit oder sonstige Veranstaltung, die die
    > Sicherheit und Leichtigkeit des Verkehrs beeinträchtigen kann, bedarf der Erlaubnis der
    > zuständigen Behörde.

    Ein Nichtteilnehmer im Regattafeld folgt den allgemeinen Regeln der BinSchStrO, hier
    insbesondere [§ 6.02a](https://www.gesetze-im-internet.de/binschstro_2012/__6_02a.html).
