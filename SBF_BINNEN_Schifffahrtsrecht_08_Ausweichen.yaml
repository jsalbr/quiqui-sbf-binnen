- question: Wann besteht die Gefahr eines Zusammenstoßes?
  type: single
  answers:
  - Wenn sich zwei Fahrzeuge bei gleichbleibender Peilung einander nähern.
  - Wenn sich zwei Fahrzeuge einander nähern und sich der Kurs der Fahrzeuge nicht ändert.
  - Wenn sich zwei Fahrzeuge einander nähern und sich der Kurs eines Fahrzeuges ändert.
  - Wenn sich zwei Fahrzeuge einander nähern und beide Fahrzeuge ihren Kurs nach steuerbord ändern.
  correct: A
  explanation: |
    Das Gesetz definiert die „Gefahr eines Zusammenstoßes“ nicht. Die Ausweichregeln in
    [§ 6.02a](https://www.gesetze-im-internet.de/binschstro_2012/__6_02a.html) und
    [§ 6.03a](https://www.gesetze-im-internet.de/binschstro_2012/__6_03a.html) setzen sie voraus,
    wenn sich Kurse kreuzen. Die Seemannschaft erkennt sie an gleichbleibender Peilung bei sich
    verringerndem Abstand.

