- question: Unter welchen Voraussetzungen darf ein Sportboot mit Elektromotor ohne Fahrerlaubnis geführt
    werden?
  type: single
  answers:
  - Die Antriebsleistung beträgt höchstens 7,5 Kilowatt Betriebsart <abbr title="Dauerbetrieb mit konstanter
    Belastung">S1</abbr> (Dauerbetrieb).
  - Es darf immer ohne Fahrerlaubnis geführt werden, unabhängig von der Antriebsleistung.
  - Bis zu einer Antriebsleistung von 11,03 Kilowatt Betriebsart S1 (Dauerbetrieb).
  - Es darf nie ohne Fahrerlaubnis geführt werden, unabhängig von der Antriebsleistung.
  correct: A
