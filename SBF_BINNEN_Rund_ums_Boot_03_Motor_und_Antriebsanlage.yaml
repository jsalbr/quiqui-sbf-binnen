- question: Was muss beim Tanken beachtet werden?
  type: single
  answers:
  - Motor abstellen, keine elektrischen Schalter betätigen, Vorbereitung gegen das Überlaufen von Kraftstoff
    treffen, kein offenes Feuer.
  - Motor in Leerlaufstellung, keine elektrischen Schalter betätigen, Vorbereitung gegen das Überlaufen
    von Kraftstoff treffen, kein offenes Feuer.
  - Fenster schließen, keine elektrischen Schalter betätigen, Vorbereitung gegen das Überlaufen von Kraftstoff
    treffen, kein offenes Feuer.
  - Motor abstellen, Feuerlöscher bereithalten, Vorbereitung gegen das Überlaufen von Kraftstoff treffen,
    kein offenes Feuer.
  correct: A
- question: Während der Fahrt sollte die Maschinenanlage ständig überwacht werden. Worauf muss besonders
    geachtet werden?
  type: single
  answers:
  - Motortemperatur, Öldruck, Ladekontrolle.
  - Kühlwasseraustritt, Drehzahlmesser, Keilriemenspannung.
  - Schraubendrehzahl, Getriebeöltemperatur, Öldruck.
  - Druck der Einspritzpumpe, Impellerpumpe, Ölpumpe.
  correct: A
- question: Die Temperatur der Antriebsmaschine überschreitet die zulässigen Grenzwerte. Was könnte die
    mögliche Ursache sein?
  type: single
  answers:
  - Defektes Thermostat, defekte Impellerpumpe, geschlossenes Seeventil, zu niedriger Kühlwasserstand.
  - Zu viel Motoröl, defekte Impellerpumpe, geschlossenes Seeventil, zu niedriger Kühlwasserstand.
  - Defektes Thermostat, defekte Impellerpumpe, geschlossenes Seeventil, zu hohe Batteriespannung.
  - Defektes Thermostat, defekte Kupplung, geschlossenes Seeventil, zu niedriger Kühlwasserstand.
  correct: A
- question: Die Ladekontrolllampe erlischt nach dem Starten nicht. Was könnte die mögliche Ursache sein?
  type: single
  answers:
  - Lichtmaschine bzw. Regler der Lichtmaschine defekt.
  - Zu hohe Motordrehzahl.
  - Keilriemen gerissen und hoher Stromverbrauch.
  - Anlasser ist nach dem Starten ausgefallen.
  correct: A
- question: Die Ölkontrollleuchte leuchtet nach dem Starten weiter. Was könnte die mögliche Ursache sein?
  type: single
  answers:
  - Druckschalter bzw. Öldruckpumpe defekt.
  - Zu viel Motoröl im Motor.
  - <abbr title="Fehlerstromschutzschalter">FI-Schalter</abbr> defekt.
  - Zu hohe Motordrehzahl.
  correct: A
- question: Der Motor ist gestartet worden. Was kann die Ursache sein, wenn nach dem Einkuppeln der Antriebswelle
    der Motor stehenbleibt?
  type: single
  answers:
  - Blockierter Propeller.
  - Blockierte Kraftstoffzufuhr.
  - Verschmutzter Ölfilter.
  - Verschmutzter Luftfilter.
  correct: A
- question: Ein Außenborder mit gefülltem Tank bleibt während der Fahrt stehen. Was könnten die Ursachen
    sein?
  type: single
  answers:
  - Belüftungsschraube geschlossen; verstopfte Kraftstoffleitung.
  - Ansaugdüsen zu groß bzw. zu klein.
  - Tankdeckel ist offen.
  - Schraube an der Welle lose.
  correct: A
