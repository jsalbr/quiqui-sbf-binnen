- question: Wie kann mitgeholfen werden, die Lebensmöglichkeiten der Pflanzen- und Tierwelt in Gewässern
    und Feuchtgebieten zu bewahren und zu fördern?
  type: single
  answers:
  - Durch umweltbewusstes Verhalten und Beachtung der "Zehn goldenen Regeln für das Verhalten von Wassersportlern
    in der Natur".
  - Durch umweltbewusstes Verhalten und Beachtung der "Zehn Grundregeln für den Wassersport".
  - Durch umsichtiges Verhalten und Beachtung der Verkehrsvorschriften.
  - Durch vorausschauendes Fahren und Ausweichen entsprechend der Verkehrsvorschriften.
  correct: A
- question: Warum sollte man sich von Schilf- und Röhrichtzonen sowie von dicht bewachsenen Uferzonen
    möglichst weit fernhalten?
  type: single
  answers:
  - Weil diese Zonen vielfach Rast- und Brutplätze besonders schutzwürdiger Vögel oder Fischlaichplätze
    sind.
  - Weil in diesen Zonen die Gefahr von Grundberührungen besteht.
  - Weil durch die Pflanzen der Propeller blockiert werden könnte.
  - Weil in diesen Zonen badende Personen schwer zu erkennen sind.
