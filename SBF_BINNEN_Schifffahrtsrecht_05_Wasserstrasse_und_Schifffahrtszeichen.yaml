- question: In welche Richtung werden bei Flüssen die Uferseiten als rechtes bzw. linkes Ufer bezeichnet?
  type: single
  answers:
  - Von der Quelle bis zur Mündung.
  - Von der Mündung bis zur Quelle.
  - Bei der Bergfahrt liegt die rechte Uferseite rechts.
  - Bei der Talfahrt liegt die rechte Uferseite links.
  correct: A
  explanation: |
    **§ 1.01 Nr. 39 BinSchStrO (rechte und linke Seite)** ·
    [§ 1.01](https://www.gesetze-im-internet.de/binschstro_2012/__1_01.html)

    > „rechte Seite/linke Seite“: die „rechte Seite“ oder „linke Seite“ des Fahrwassers/der
    > Fahrrinne, bezogen auf die Richtung „Talfahrt“;

    Die Richtung „Talfahrt“ ist auf einem Fluss die Richtung von der Quelle zur Mündung. Das rechte
    und linke Ufer werden also in Richtung der Strömung bestimmt.

