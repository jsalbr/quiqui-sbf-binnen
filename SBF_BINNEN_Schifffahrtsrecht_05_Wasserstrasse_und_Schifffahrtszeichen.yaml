- question: Welche Fahrrinnenseite hat ein Bergfahrer an seiner Steuerbordseite und wie ist diese gekennzeichnet?
  type: single
  answers:
  - Die linke Fahrrinnenseite, gekennzeichnet durch grüne Spitztonnen oder Schwimmstangen.
  - Die rechte Fahrrinnenseite, gekennzeichnet durch rote Stumpftonnen oder Schwimmstangen.
  - Die linke Fahrrinnenseite, gekennzeichnet durch rote Stumpftonnen oder Schwimmstangen.
  - Die rechte Fahrrinnenseite, gekennzeichnet durch grüne Spitztonnen oder Schwimmstangen.
  correct: A
  explanation: |
    **§ 1.01 Nr. 39 BinSchStrO (rechte und linke Seite)** ·
    [§ 1.01](https://www.gesetze-im-internet.de/binschstro_2012/__1_01.html)

    > „rechte Seite/linke Seite“: die „rechte Seite“ oder „linke Seite“ des Fahrwassers/der
    > Fahrrinne, bezogen auf die Richtung „Talfahrt“;

    **Anlage 8 Abschnitt II Nr. 2 BinSchStrO (Bezeichnung der Fahrrinne, linke Seite)** · [Anlage
    8](https://www.gesetze-im-internet.de/binschstro_2012/anlage_8.html)

    > Linke Seite Farbe: grün Form: Spitztonne, Tonne mit Toppzeichen, Leuchttonne, Schwimmstange
